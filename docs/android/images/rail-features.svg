<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { fill: #F1F0EA; font-size: 42px; font-weight: bold; }
      .subtitle { fill: #9D9D9F; font-size: 20px; }
      .colhead { font-size: 19px; font-weight: bold; letter-spacing: 2px; }
      .railname { fill: #F0D830; font-size: 25px; font-weight: bold; }
      .railcode { fill: #9D9D9F; font-size: 14px; font-family: Menlo, monospace; }
      .cellhead { fill: #D0CFC8; font-size: 19px; font-weight: bold; }
      .cellbody { fill: #B5B4B6; font-size: 16px; }
      .cellfile { fill: #605F61; font-size: 13px; font-family: Menlo, monospace; }
      .hidden { fill: #605F61; font-size: 16px; font-style: italic; }
      .footnote { fill: #9D9D9F; font-size: 16px; }
      .num { fill: #0A0A0A; font-size: 18px; font-weight: bold; }
      .icon { stroke: #F0D830; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1920" height="1500" fill="#0A0A0A"/>

  <text x="40" y="72" class="title">Rail Features — Android Edge Studio</text>
  <text x="40" y="106" class="subtitle">The seven Navigation Rail items, top to bottom, and what each puts in the Data Panel, Content Pane, and Inspector</text>

  <!-- column headers -->
  <text x="48" y="166" class="colhead" fill="#F0D830">RAIL</text>
  <text x="388" y="166" class="colhead" fill="#5B8DD9">DATA PANEL (200dp)</text>
  <text x="728" y="166" class="colhead" fill="#58B368">CONTENT PANE</text>
  <text x="1368" y="166" class="colhead" fill="#E8853A">INSPECTOR (300dp)</text>

  <!-- ============ ROW 1 : Presence ============ -->
  <g>
    <rect x="40" y="190" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="224" r="15" fill="#F0D830"/><text x="74" y="231" text-anchor="middle" class="num">1</text>
    <!-- sync icon: circular arrows -->
    <g class="icon" transform="translate(56,255)">
      <path d="M 6 18 A 14 14 0 0 1 30 8"/><path d="M 30 8 L 30 0 M 30 8 L 22 9"/>
      <path d="M 30 18 A 14 14 0 0 1 6 28"/><path d="M 6 28 L 6 36 M 6 28 L 14 27"/>
    </g>
    <text x="104" y="284" class="railname">Presence</text>
    <text x="104" y="308" class="railcode">SUBSCRIPTIONS · "Subscriptions"</text>
    <text x="104" y="328" class="railcode">Icons.Outlined.Sync</text>

    <rect x="380" y="190" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#5B8DD9"/>
    <text x="398" y="222" class="cellhead">Subscriptions</text>
    <text x="398" y="248" class="cellbody">What this peer is syncing</text>
    <text x="398" y="270" class="cellbody">between peers · add / edit /</text>
    <text x="398" y="292" class="cellbody">remove via FAB</text>
    <text x="398" y="330" class="cellfile">SubscriptionsRepositoryImpl.kt</text>

    <rect x="720" y="190" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="222" class="cellhead">Connected Peers  +  Presence Graph *</text>
    <text x="738" y="248" class="cellbody">Local peer · remote peers · transports · network interfaces,</text>
    <text x="738" y="270" class="cellbody">plus a visual mesh-topology graph (* planned)</text>
    <text x="738" y="330" class="cellfile">ConnectedPeersScreen.kt · SystemRepositoryImpl.kt</text>

    <rect x="1360" y="190" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="222" class="cellhead">Feature documentation</text>
    <text x="1378" y="248" class="cellbody">How subscriptions and presence work</text>
    <text x="1378" y="330" class="cellfile">assets/help/subscription.md</text>
  </g>

  <!-- ============ ROW 2 : Query Workbench ============ -->
  <g>
    <rect x="40" y="366" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="400" r="15" fill="#F0D830"/><text x="74" y="407" text-anchor="middle" class="num">2</text>
    <!-- storage icon: 3 bars with dots -->
    <g class="icon" transform="translate(56,432)">
      <rect x="0" y="0" width="34" height="8" rx="2"/><circle cx="6" cy="4" r="1.4" fill="#F0D830"/>
      <rect x="0" y="13" width="34" height="8" rx="2"/><circle cx="6" cy="17" r="1.4" fill="#F0D830"/>
      <rect x="0" y="26" width="34" height="8" rx="2"/><circle cx="6" cy="30" r="1.4" fill="#F0D830"/>
    </g>
    <text x="104" y="460" class="railname">Query Workbench</text>
    <text x="104" y="484" class="railcode">QUERY · "Query"</text>
    <text x="104" y="504" class="railcode">Icons.Outlined.Storage</text>

    <rect x="380" y="366" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#5B8DD9"/>
    <text x="398" y="398" class="cellhead">Collections</text>
    <text x="398" y="424" class="cellbody">Document count + indexes per</text>
    <text x="398" y="446" class="cellbody">collection · add / remove</text>
    <text x="398" y="468" class="cellbody">indexes</text>
    <text x="398" y="506" class="cellfile">CollectionsRepositoryImpl.kt</text>

    <rect x="720" y="366" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="398" class="cellhead">Query Editor  →  Query Results below</text>
    <text x="738" y="424" class="cellbody">Write and run DQL against the collections; results render</text>
    <text x="738" y="446" class="cellbody">in the lower split</text>
    <text x="738" y="506" class="cellfile">QueryEditorScreen.kt · QueryExecutionService.kt</text>

    <rect x="1360" y="366" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="398" class="cellhead">History · Favorites · JSON Viewer ·</text>
    <text x="1378" y="424" class="cellhead">Query Metrics · docs</text>
    <text x="1378" y="450" class="cellbody">Per-query EXPLAIN + full document view</text>
    <text x="1378" y="506" class="cellfile">inspector/Query*Inspector.kt · help/query.md</text>
  </g>

  <!-- ============ ROW 3 : Observation ============ -->
  <g>
    <rect x="40" y="542" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="576" r="15" fill="#F0D830"/><text x="74" y="583" text-anchor="middle" class="num">3</text>
    <!-- visibility icon: eye -->
    <g class="icon" transform="translate(56,608)">
      <path d="M 0 14 C 8 2 28 2 36 14 C 28 26 8 26 0 14 Z"/>
      <circle cx="18" cy="14" r="6"/>
    </g>
    <text x="104" y="636" class="railname">Observation</text>
    <text x="104" y="660" class="railcode">OBSERVERS · "Observers"</text>
    <text x="104" y="680" class="railcode">Icons.Outlined.Visibility</text>

    <rect x="380" y="542" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#5B8DD9"/>
    <text x="398" y="574" class="cellhead">Registered Observers</text>
    <text x="398" y="600" class="cellbody">Every registered observer with</text>
    <text x="398" y="622" class="cellbody">an activated indicator · add /</text>
    <text x="398" y="644" class="cellbody">edit / delete</text>
    <text x="398" y="682" class="cellfile">ObservableRepositoryImpl.kt</text>

    <rect x="720" y="542" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="574" class="cellhead">Fired Events  →  Event detail below</text>
    <text x="738" y="600" class="cellbody">Events fired by the activated observer; selecting one shows</text>
    <text x="738" y="622" class="cellbody">its results (insert / update / delete / move filters)</text>
    <text x="738" y="682" class="cellfile">ObserverDetailScreen.kt</text>

    <rect x="1360" y="542" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="574" class="cellhead">Feature documentation</text>
    <text x="1378" y="600" class="cellbody">Observer setup and change tracking</text>
    <text x="1378" y="682" class="cellfile">assets/help/observe.md</text>
  </g>

  <!-- ============ ROW 4 : Log Analyzer ============ -->
  <g>
    <rect x="40" y="718" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="752" r="15" fill="#F0D830"/><text x="74" y="759" text-anchor="middle" class="num">4</text>
    <!-- description icon: document -->
    <g class="icon" transform="translate(58,784)">
      <path d="M 0 0 L 20 0 L 30 10 L 30 38 L 0 38 Z"/><path d="M 20 0 L 20 10 L 30 10"/>
      <line x1="7" y1="19" x2="23" y2="19"/><line x1="7" y1="27" x2="23" y2="27"/>
    </g>
    <text x="104" y="812" class="railname">Log Analyzer</text>
    <text x="104" y="836" class="railcode">LOGGING · "Logging"</text>
    <text x="104" y="856" class="railcode">Icons.Outlined.Description</text>

    <rect x="380" y="718" width="320" height="160" rx="10" fill="#141314" stroke="#3B3A3B" stroke-dasharray="6 6"/>
    <text x="398" y="750" class="hidden">Not used — hidden</text>
    <text x="398" y="776" class="hidden">Content Pane gets the full width</text>

    <rect x="720" y="718" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="750" class="cellhead">Log viewer + filtering   (full width)</text>
    <text x="738" y="776" class="cellbody">Live + historical Ditto SDK logs · filter by level, component,</text>
    <text x="738" y="798" class="cellbody">and free-text search</text>
    <text x="738" y="858" class="cellfile">LoggingScreen.kt · DittoLogCaptureService · LogFileParser</text>

    <rect x="1360" y="718" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="750" class="cellhead">Feature documentation</text>
    <text x="1378" y="776" class="cellbody">Log levels and debugging use cases</text>
    <text x="1378" y="858" class="cellfile">assets/help/logging.md</text>
  </g>

  <!-- ============ ROW 5 : App Metrics ============ -->
  <g>
    <rect x="40" y="894" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="928" r="15" fill="#F0D830"/><text x="74" y="935" text-anchor="middle" class="num">5</text>
    <!-- memory icon: chip -->
    <g class="icon" transform="translate(58,960)">
      <rect x="5" y="5" width="26" height="26" rx="3"/><rect x="13" y="13" width="10" height="10"/>
      <line x1="11" y1="5" x2="11" y2="0"/><line x1="18" y1="5" x2="18" y2="0"/><line x1="25" y1="5" x2="25" y2="0"/>
      <line x1="11" y1="31" x2="11" y2="36"/><line x1="18" y1="31" x2="18" y2="36"/><line x1="25" y1="31" x2="25" y2="36"/>
      <line x1="5" y1="11" x2="0" y2="11"/><line x1="5" y1="18" x2="0" y2="18"/><line x1="5" y1="25" x2="0" y2="25"/>
      <line x1="31" y1="11" x2="36" y2="11"/><line x1="31" y1="18" x2="36" y2="18"/><line x1="31" y1="25" x2="36" y2="25"/>
    </g>
    <text x="104" y="988" class="railname">App Metrics</text>
    <text x="104" y="1012" class="railcode">APP_METRICS · "App Metrics"</text>
    <text x="104" y="1032" class="railcode">Icons.Outlined.Memory</text>

    <rect x="380" y="894" width="320" height="160" rx="10" fill="#141314" stroke="#3B3A3B" stroke-dasharray="6 6"/>
    <text x="398" y="926" class="hidden">Not used — hidden</text>
    <text x="398" y="952" class="hidden">Content Pane gets the full width</text>

    <rect x="720" y="894" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="926" class="cellhead">Running-app metrics   (full width)</text>
    <text x="738" y="952" class="cellbody">Memory (resident / virtual) · CPU time · file descriptors ·</text>
    <text x="738" y="974" class="cellbody">uptime — card layout, auto-refresh every 15 s</text>
    <text x="738" y="1034" class="cellfile">metrics/AppMetricsScreen.kt · AppMetricsRepositoryImpl.kt</text>

    <rect x="1360" y="894" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="926" class="cellhead">Feature documentation</text>
    <text x="1378" y="952" class="cellbody">Process-resource metric definitions</text>
    <text x="1378" y="1034" class="cellfile">assets/help/appmetrics.md</text>
  </g>

  <!-- ============ ROW 6 : Query Metrics ============ -->
  <g>
    <rect x="40" y="1070" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="1104" r="15" fill="#F0D830"/><text x="74" y="1111" text-anchor="middle" class="num">6</text>
    <!-- manage_search icon: lines + magnifier -->
    <g class="icon" transform="translate(56,1136)">
      <line x1="0" y1="4" x2="14" y2="4"/><line x1="0" y1="13" x2="10" y2="13"/><line x1="0" y1="22" x2="14" y2="22"/>
      <circle cx="25" cy="13" r="9"/><line x1="31" y1="20" x2="38" y2="28"/>
    </g>
    <text x="104" y="1164" class="railname">Query Metrics</text>
    <text x="104" y="1188" class="railcode">QUERY_METRICS · "Query Metrics"</text>
    <text x="104" y="1208" class="railcode">Icons…Outlined.ManageSearch</text>

    <rect x="380" y="1070" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#5B8DD9"/>
    <text x="398" y="1102" class="cellhead">Executed Queries *</text>
    <text x="398" y="1128" class="cellbody">Queries run since app start —</text>
    <text x="398" y="1150" class="cellbody">statement, run count, duration</text>
    <text x="398" y="1210" class="cellfile">QueryMetricsRepositoryImpl.kt</text>

    <rect x="720" y="1070" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="1102" class="cellhead">Query detail</text>
    <text x="738" y="1128" class="cellbody">Detailed information for the selected query — full EXPLAIN</text>
    <text x="738" y="1150" class="cellbody">output (auto-capture, 200-record cap)</text>
    <text x="738" y="1210" class="cellfile">metrics/QueryMetricsScreen.kt</text>

    <rect x="1360" y="1070" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="1102" class="cellhead">Feature documentation</text>
    <text x="1378" y="1128" class="cellbody">EXPLAIN analysis and capture limits</text>
    <text x="1378" y="1210" class="cellfile">assets/help/querymetrics.md</text>
  </g>

  <!-- ============ ROW 7 : Database Metrics ============ -->
  <g>
    <rect x="40" y="1246" width="320" height="160" rx="10" fill="#1D1C1D" stroke="#3B3A3B"/>
    <circle cx="74" cy="1280" r="15" fill="#F0D830"/><text x="74" y="1287" text-anchor="middle" class="num">7</text>
    <!-- data_usage icon: donut -->
    <g class="icon" transform="translate(58,1312)">
      <path d="M 18 0 A 18 18 0 1 1 2.4 27"/>
      <path d="M 18 7 A 11 11 0 1 1 8.5 23.5" stroke="#9D9D9F"/>
    </g>
    <text x="104" y="1340" class="railname">Database Metrics</text>
    <text x="104" y="1364" class="railcode">DISK_USAGE · "Disk Usage"</text>
    <text x="104" y="1384" class="railcode">Icons.Outlined.DataUsage</text>

    <rect x="380" y="1246" width="320" height="160" rx="10" fill="#141314" stroke="#3B3A3B" stroke-dasharray="6 6"/>
    <text x="398" y="1278" class="hidden">Not used — hidden</text>
    <text x="398" y="1304" class="hidden">Content Pane gets the full width</text>

    <rect x="720" y="1246" width="620" height="160" rx="10" fill="#1D1C1D" stroke="#58B368"/>
    <text x="738" y="1278" class="cellhead">Database storage   (full width)</text>
    <text x="738" y="1304" class="cellbody">Total database file size + size of each collection, with size</text>
    <text x="738" y="1326" class="cellbody">indicators — auto-refresh every 15 s</text>
    <text x="738" y="1386" class="cellfile">metrics/DiskUsageScreen.kt · AppMetricsRepositoryImpl.kt</text>

    <rect x="1360" y="1246" width="520" height="160" rx="10" fill="#1D1C1D" stroke="#E8853A"/>
    <text x="1378" y="1278" class="cellhead">Feature documentation</text>
    <text x="1378" y="1304" class="cellbody">Storage metrics explained</text>
    <text x="1378" y="1386" class="cellfile">assets/help/diskusage.md  (missing!)</text>
  </g>

  <!-- footnotes -->
  <text x="40" y="1448" class="footnote">* Gaps vs. current code: Presence Graph not yet implemented · Query Metrics list currently renders inside the Content Pane (target: Data Panel) · diskusage.md missing from assets/help/</text>
  <text x="40" y="1476" class="footnote">Rail order = StudioNavItem enum order — viewmodel/MainStudioViewModel.kt · Region terms: docs/android/UI_TERMINOLOGY.md</text>
</svg>
